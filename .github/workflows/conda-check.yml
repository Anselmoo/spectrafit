name: 🐍 CI - Conda

on: [push]

jobs:
  build-linux:
    if: github.repository == 'Anselmoo/spectrafit'
    name: 🏗️ Build (Linux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - spectrafit
          - spectrafit-jupyter
          - spectrafit-all
          - spectrafit-rixs
      max-parallel: 5

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🐍 Set up Conda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
        with:
          auto-update-conda: true
          python-version: "3.12"
          channels: conda-forge,defaults
      - name: 📦 Install spectrafit package
        shell: bash -l {0}
        run: |
          conda info
          conda install -c conda-forge ${{ matrix.package }}
      - name: ✅ Verify Python version
        shell: bash -l {0}
        run: |
          python --version
          which python
