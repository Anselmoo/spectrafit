name: 🐍 CI - Python Package

on:
  push:
    branches: [main, feature/*, release/*, hotfix/*]
  pull_request:
    branches: [main, develop]
  repository_dispatch:
    types: [create-pull-request]

jobs:
  pre-commit:
    if: github.repository == 'Anselmoo/spectrafit'
    name: 🧹 Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 🐍 Set up uv for pre-commit
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: 3.11
      - name: 💾 Cache pre-commit
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-
      - name: ✅ Pre-commit run
        run: |
          uv run pre-commit run --all-files --color=always
  build:
    if: github.repository == 'Anselmoo/spectrafit'
    name: 🏗️ Build & Test Python ${{ matrix.python-version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    needs: pre-commit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        arch: [x64]
    defaults:
      run:
        shell: bash
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - name: 📦 Install the project
        run: uv sync --all-extras --dev
      - name: 🧪 Test SpectraFit
        run: uv run --group dev --all-extras pytest spectrafit/
      - name: 📊 Codecov
        if: ${{ success() && !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          name: codecov-umbrella
          flags: unittests
          verbose: true
          env_vars: OS,PYTHON
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  minimal-build:
    if: github.repository == 'Anselmoo/spectrafit'
    name: 🏗️ Minimal Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.10"
      - name: 📦 Install the project
        run: |
          uv sync --all-extras
          uv run pip install -e .
  install-build:
    if: github.repository == 'Anselmoo/spectrafit'
    name: 🏗️ Install from Wheel
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.10"
      - name: 🏗️ Setup the project
        run: |
          uv sync --all-extras
          uv build
      - name: 📦 Install the wheel
        run: |
          uv pip install dist/*.whl
          uv run spectrafit -v
  documentation:
    if: github.repository == 'Anselmoo/spectrafit'
    name: 📚 Build Documentation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: 🐍 Install uv and doc dependencies
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.10"
      - name: 📦 Install the project
        run: uv sync --all-extras --group docs
      - name: 🛠️ Set git config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      - name: 🏗️ Build documentation
        if: ${{ !contains(github.ref, 'refs/heads/main')}}
        run: uv run --group docs --all-extras mkdocs build --clean
      - name: 🚀 Deploy documentation develops
        if: contains(github.ref, 'refs/heads/main')
        run: uv run --group docs --all-extras mike deploy --push --update-aliases develop
