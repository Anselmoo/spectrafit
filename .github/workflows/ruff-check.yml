name: 🔍 CI - Ruff Lint

on:
  push:
    branches: [main, v2.0.0, feature/*, feat/*, release/*, hotfix/*, copilot/*]
  pull_request:
    branches: [main, develop, v2.0.0]

jobs:
  ruff:
    if: github.repository == 'Anselmoo/spectrafit'
    name: 🔍 Ruff Check - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: 🐍 Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - name: 📦 Install the project
        run: uv sync --all-extras --dev
      - name: 🔍 Ruff check
        run: uv run ruff check spectrafit/
      - name: 🎨 Ruff format check
        run: uv run ruff format --check spectrafit/
