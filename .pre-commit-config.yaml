repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: mkdocs.yml
      - id: check-toml
        exclude: uv.lock
      - id: check-json
        exclude: .devcontainer/devcontainer.json
      - id: check-symlinks
      - id: end-of-file-fixer
        exclude: docs/images/logo.svg
      - id: trailing-whitespace
      - id: check-ast
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: \.ipynb
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff
        files: spectrafit/
      - id: ruff-format
        files: spectrafit/
  # ty replaces mypy; hook pending astral-sh/ty pre-commit support (beta)
  # Uncomment when astral-sh/ty publishes .pre-commit-hooks.yaml:
  # - repo: https://github.com/astral-sh/ty
  #   rev: 0.0.20
  #   hooks:
  #     - id: ty
  #       args: [check, spectrafit/]
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        additional_dependencies: [toml>=0.10.2]
  # pyupgrade for Python 3.10+
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus, --keep-percent-format]
