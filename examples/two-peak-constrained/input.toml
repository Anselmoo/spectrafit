schema_version = "2.0"
config_type = "peak_fit"

[meta]
description = "Gaussian + pseudo-Voigt example with cross-component constraints."

[data]
infile = "data.csv"
x_col = "energy"
y_col = "intensity"
separator = ","

[solver]
method = "leastsq"
max_nfev = 1000
nan_policy = "propagate"
calc_covar = true

[[components]]
id = "p1"
model = "gaussian"

[components.parameters]
amplitude = { value = 1.0, bounds = [0.0, 3.0], vary = true }
center = { value = -0.5, bounds = [-2.0, 0.0], vary = true }
fwhmg = { value = 0.3, bounds = [0.05, 1.0], vary = true }

[[components]]
id = "p2"
model = "pseudovoigt"

[components.parameters]
amplitude = { value = 0.8, bounds = [0.0, 3.0], vary = true }
center = { value = 0.5, bounds = [0.0, 2.0], vary = false, expr = "p1.center + 1.0" }
fwhmg = { value = 0.25, bounds = [0.05, 1.0], vary = true }
fwhml = { value = 0.25, bounds = [0.05, 1.0], vary = false, expr = "p2.fwhmg" }

[[components]]
id = "bg"
model = "linear"

[components.parameters]
slope = { value = 0.0, bounds = [-0.5, 0.5], vary = false }
intercept = { value = 0.02, bounds = [0.0, 0.2], vary = true }
