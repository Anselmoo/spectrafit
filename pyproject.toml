[project]
name = "SpectraFit"
version = "2.0.0.dev0"
description = "Fast fitting of 2D- and 3D-Spectra with established routines"
authors = [{ name = "Anselm Hahn", email = "anselm.hahn@gmail.com" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "BSD-3-Clause"
maintainers = [{ name = "Anselm Hahn", email = "anselm.hahn@gmail.com" }]
keywords = [
  "2D-Spectra",
  "3D-Spectra",
  "fitting",
  "curve-fitting",
  "peak-fitting",
  "spectrum",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Environment :: Console",
  "Framework :: Matplotlib",
  "Framework :: Jupyter :: JupyterLab",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "art>=6.5",
  "emcee>=3.1.6",
  "eval-type-backport>=0.2.2",
  "lmfit>=1.3.2",
  "numdifftools>=0.9.41",
  "numpy>=1.24.4",
  "openpyxl>=3.1.5",
  "pandas>=2.0.3",
  "pydantic>=2.10.6",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.3.2",
  "scipy>=1.10.1",
  "seaborn>=0.13.2",
  "tabulate>=0.9.0",
  "tomli>=2.2.1",
  "tomli-w>=1.0.0",
  "tqdm>=4.67.1",
  "typer[all]>=0.20.0",
]

[project.optional-dependencies]
jupyter = [
  "dtale>=3.17.0",
  "itables>=2.3.0",
  "jupyterlab>=4.3.6",
  "kaleido==1.0.0",
  "plotly>=6.0.1",
  "python-pptx>=1.0.2",
]
jupyter-dash = [
  "dash-bootstrap-components>=1.6.0",
  "dash-bootstrap-templates>=2.1.0",
  "ipywidgets>=8.1.6",
  "jupyter-dash>=0.4.2",
]
graph = ["networkx>=3.1", "pydot>=3.0.4"]
all = [
  "dash-bootstrap-components>=1.6.0",
  "dash-bootstrap-templates>=2.1.0",
  "dtale>=3.17.0",
  "ipywidgets>=8.1.6",
  "itables>=2.3.0",
  "jupyter-dash>=0.4.2",
  "jupyterlab>=4.3.6",
  "kaleido>=0.2.1",
  "networkx>=3.1",
  "plotly>=6.0.1",
  "pydot>=3.0.4",
  "python-pptx>=1.0.2",
]

[project.urls]
Homepage = "https://pypi.org/project/spectrafit/"
Repository = "https://github.com/Anselmoo/spectrafit"
Documentation = "https://anselmoo.github.io/spectrafit/"
Changelog = "https://github.com/Anselmoo/spectrafit/blob/main/CHANGELOG.md"
Issues = "https://github.com/Anselmoo/spectrafit/issues"

[project.scripts]
spectrafit = "spectrafit.cli.main:run"
spectrafit-jupyter = "spectrafit.app.app:jupyter"

[dependency-groups]
dev = [
  "bandit>=1.7.10",
  "black[jupyter]>=24.8.0",
  "bump-pydantic>=0.8.0",
  "dash[testing]>=2.18.2",
  "poethepoet>=0.42.1",
  "pre-commit>=3.5.0",
  "pytest>=8.3.5",
  "pytest-clarity>=1.0.1",
  "pytest-console-scripts>=1.4.1",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "pytest-plt>=1.1.1",
  "pytest-xdist>=3.6.1",
  "pytest-json-report>=1.5.0",
  "ruff>=0.9.10",
  "ty>=0.0.20",
  "types-mock>=5.1.0.20240425",
  "types-pyyaml>=6.0.12.20241230",
  "types-tabulate>=0.9.0.20241207",
  "types-toml>=0.10.8.20240310",
]
docs = [
  "jupytext>=1.17.0",
  "mathjax>=0.1.2",
  "mike>=2.1.3",
  "mkdocs-autorefs>=1.2.0",
  "mkdocs-git-revision-date-localized-plugin>=1.4.5",
  "mkdocs-glightbox>=0.4.0",
  "mkdocs-jupyter>=0.24.8",
  "mkdocs-literate-nav>=0.6.1",
  "mkdocs-material>=9.6.12",
  "mkdocs-minify-plugin>=0.8.0",
  "mkdocs-section-index>=0.3.9",
  "mkdocs-table-reader-plugin>=3.1.0",
  "mkdocstrings[python]>=0.26.1",
]


[tool.uv]
default-groups = ["dev", "docs"]

[tool.hatch.build.targets.sdist]
include = ["spectrafit", "spectrafit/plugins/img/SpectraFit.png"]
exclude = ["docs/", "tools/", "spectrafit/test/", "spectrafit/**/test/"]

[tool.hatch.build.targets.wheel]
include = ["spectrafit", "spectrafit/plugins/img/SpectraFit.png"]
exclude = ["docs/", "tools/", "spectrafit/test/", "spectrafit/**/test/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
fix = true
include = ["*.py"]
src = ["spectrafit"]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
extend-ignore = [
  "E721",
  "E731",
  "ANN401",
  "UP006",
  "UP007",
  "PLR0913",
  "S301",
  "COM812",
  "FBT001",  # Boolean type hint positional argument
  "FBT002",  # Boolean default value positional argument
  "FBT003",  # Boolean positional value in function call
  "B018",    # Useless expression
  "PT011",   # Pytest raises too broad
  "PT012",   # Pytest raises with multiple statements
  "PGH003",  # Blanket type ignore
  "PLW2901", # Redefined loop name
  "ARG001",  # Unused function argument
  "PERF203", # Try except in loop
  "S506",    # Unsafe yaml load
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches

]

[tool.ruff.lint.per-file-ignores]
"spectrafit/**/test_*.py" = [
  "S101",
  "PLR2004",
  "PLC0415", # allow in line import of modules
  "D102",
  "D101",
  "ANN201",
  "ANN001",
  "ARG001",
]
"tests/**/*.py" = [
  "S101",
  "PLR2004",
  "PLC0415",
  "D102",
  "D101",
  "D103",
  "ANN201",
  "ANN001",
  "ARG001",
  "ARG002",
  "TC003",
]
"scripts/*.py" = ["INP001"]
"spectrafit/models/builtin.py" = ["PLR0913"]
"spectrafit/models/solver.py" = ["PLR0913"]
"spectrafit/models/distributions.py" = ["PLR0913"]
"spectrafit/api/*_model.py" = ["TC001", "TC003"]
"spectrafit/core/*.py" = ["TC001", "TC002"]
"spectrafit/report/*.py" = ["TC001", "TC002"]
"spectrafit/plugins/notebook/*.py" = ["TC001", "TC002"]
"spectrafit/jupyter/*.py" = ["TC001", "TC002"]
"spectrafit/plugins/color_schemas.py" = ["RUF012"]
"spectrafit/plugins/test/test_notebook.py" = ["SLF001"]
"spectrafit/cli/commands/*.py" = [
  "TC003",
  "TRY301",
  "PLC0415",
  "C901",
  "PLR0915",
]


[tool.ruff.lint.isort]
force-single-line = true
lines-between-types = 1
lines-after-imports = 2
known-third-party = ["hatchling.build"]
required-imports = ["from __future__ import annotations"]
case-sensitive = true
combine-as-imports = false

[tool.ruff.lint.pycodestyle]
max-doc-length = 100
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pytest]
script_launch_mode = "subprocess"
minversion = "7.0"
addopts = [
  "--cov",
  "--cov-report=xml:coverage.xml",
  "--junitxml=junit.xml",
  "-o",
  "junit_family=legacy",
  "--diff-symbols",
  "--plots",
  "-vv",
  "-m",
  "not slow",
]
testpaths = ["tests"]
markers = [
  "api: tests for API models",
  "models: tests for model implementations",
  "performance: tests that check performance characteristics",
  "integration: tests with subprocess/IO",
  "unit: fast unit tests",
  "e2e: end-to-end workflow tests",
  "slow: tests taking >10s",
  "validation: scientific validation tests",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "pass",
  "\\.\\.\\.",
  "if again == \"y\":",
  "__status__.yes_no()",
]
skip_covered = true
show_missing = true

[tool.ty]
# ty is the hard-fail type checker (replaces mypy). Track: https://github.com/astral-sh/ty

[tool.ty.rules]
# Suppress Pydantic-model instantiation false positives (known ty/Pydantic v2 issue)
missing-argument = "warn"
invalid-argument-type = "warn"
# False positives: dict[str, object].get(key, default) fails ty's overload resolution
# because the default {} is inferred as dict[str, Never] — not a real error.
no-matching-overload = "warn"
# False positives: lmfit's MinimizerResult has no published type stubs;
# .params, .success, .nfev, .message exist at runtime.
unresolved-attribute = "warn"

[tool.poe]

[tool.poe.tasks]
test = { cmd = "pytest tests/", help = "Run the full test suite", use_exec = true }
test-fast = { cmd = "pytest tests/ -m 'not slow' -x", help = "Run tests (skip slow, stop on first fail)", use_exec = true }
test-cov = { cmd = "pytest tests/ --cov --cov-report=term-missing", help = "Run tests with coverage report", use_exec = true }
typecheck = { cmd = "ty check spectrafit/ --exclude 'spectrafit/report/**' --exclude 'spectrafit/core/postprocessing.py' --exclude 'spectrafit/core/export.py'", help = "Type-check with ty (hard-fail)" }
docs-build = { cmd = "mkdocs build --clean", help = "Build documentation" }
docs-serve = { cmd = "mkdocs serve", help = "Serve documentation locally", use_exec = true }
pre-commit-all = { cmd = "pre-commit run --all-files", help = "Run all pre-commit hooks", use_exec = true }

[tool.poe.tasks.lint]
shell = "ruff check spectrafit/ && ruff format --check spectrafit/"
help = "Lint and format-check code with ruff"

[tool.poe.tasks.format]
shell = "ruff format spectrafit/ && ruff check --fix spectrafit/"
help = "Auto-format and fix lint issues"

[tool.poe.tasks.ci]
shell = "ruff check spectrafit/ && ruff format --check spectrafit/ && ty check spectrafit/ --exclude 'spectrafit/report/**' --exclude 'spectrafit/core/postprocessing.py' --exclude 'spectrafit/core/export.py' && pytest tests/"
help = "Full CI gate: lint + ty + tests (frozen modules excluded from ty)"

[tool.poe.tasks.clean]
shell = "find . -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null; rm -rf dist/ .coverage coverage.xml junit.xml"
help = "Remove build artifacts and caches"

[tool.poe.tasks.generate-examples]
cmd = "python scripts/generate_examples.py"
help = "Regenerate synthetic CSV data for all examples/ directories"

[tool.poe.tasks.generate-plots]
cmd = "python scripts/generate_plots.py"
help = "Generate fit-validation PNG plots for all examples/ (Agg backend, saved to examples/*/fit_validation.png)"

[tool.poe.tasks.validate-examples]
cmd = "pytest tests/integration/test_examples.py -v"
help = "Smoke-test all examples/*/input.toml via FittingPipeline"

[tool.poe.tasks.scan]
cmd = "python scripts/scan_antipatterns.py"
help = "Scan spectrafit/ for known anti-patterns (use --module, --severity, --json)"

[tool.poe.tasks.arch-check]
cmd = "python scripts/architecture_check.py"
help = "Check spectrafit/ architecture invariants (use --module, --invariant, --json)"

[tool.poe.tasks.health]
shell = "python scripts/scan_antipatterns.py; python scripts/architecture_check.py"
help = "Run both anti-pattern scan and architecture check"

[tool.poe.tasks.scan-antipatterns]
cmd = "python scripts/scan_antipatterns.py"
help = "Scan spectrafit/ for known anti-patterns (use --module, --severity, --json)"
