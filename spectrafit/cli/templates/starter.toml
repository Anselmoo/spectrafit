# SpectraFit Project Configuration
# ---------------------------------
# Generated by `spectrafit init`. Edit this file to configure your fit.
# Reference: https://anselmoo.github.io/spectrafit/

[fitting.parameters.minimizer]
nan_policy = "propagate"

[fitting.parameters.optimizer]
max_nfev = 2000
method = "leastsq"

# Each section [[fitting.peaks.N]] defines one spectral component.
# Supported models: gaussian, lorentzian, pseudovoigt, voigt, pearson7, ...
# Run `spectrafit new-config --help` for a full list.

[[fitting.peaks]]
[fitting.peaks.gaussian]
amplitude = { min = 0.0, max = 2.0, vary = true, value = 1.0 }
center    = { min = -2.0, max = 2.0, vary = true, value = 0.0 }
fwhmg     = { min = 0.02, max = 1.0, vary = true, value = 0.2 }
